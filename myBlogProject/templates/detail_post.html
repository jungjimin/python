{% extends "layout.html" %}
{% block content %}
<div class="container mt-4">
    <a href="/" class="btn btn-secondary mb-3">← 돌아가기</a>
    <div class="card">
        <div class="card-body">
            <h2>{{ post.title }}</h2>
            <small class="text-muted">{{ post.created_at.strftime('%Y-%m-%d %H:%M') }}</small>
            <hr>
            <p>{{ post.content }}</p>
        </div>
    </div>
</div>
{% endblock %}
