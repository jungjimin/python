{% extends "layout.html" %}
{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">📚 내 블로그</h1>
    <a href="/posts/new" class="btn btn-primary mb-3">✏️ 새 글 쓰기</a>
    {% for post in posts %}
        <div class="card mb-3">
            <div class="card-body">
                <h4><a href="/posts/{{ post.id }}">{{ post.title }}</a></h4>
                <small class="text-muted">{{ post.created_at.strftime('%Y-%m-%d %H:%M') }}</small>
                <p class="mt-2">{{ post.content[:100] }}...</p>
            </div>
        </div>
    {% endfor %}
</div>
{% endblock %}
