
{% extends "base.html" %}

{% block title %}홈 - My Blog{% endblock %}

{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1>블로그 글 목록</h1>
    <a href="/new_post" class="btn btn-primary">새 글 작성</a>
  </div>
  {% for post in posts %}
    <div class="card mb-3">
      <div class="card-body">
        <h5 class="card-title"><a href="/post/{{ post.id }}">{{ post.title }}</a></h5>
        <h6 class="card-subtitle mb-2 text-muted">{{ post.category }} | {{ post.created_at }}</h6>
        <p class="card-text">{{ post.content[:100] }}...</p>
      </div>
    </div>
  {% endfor %}
{% endblock %}
