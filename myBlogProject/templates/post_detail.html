
{% extends "base.html" %}

{% block title %}{{ post.title }} - My Blog{% endblock %}

{% block content %}
  <h1>{{ post.title }}</h1>
  <p class="text-muted">{{ post.category }} | {{ post.created_at }}</p>
  <div>{{ post.content | safe }}</div>
  <a href="/" class="btn btn-secondary mt-3">← 돌아가기</a>
{% endblock %}
