<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>테트리스 게임</title>
  <style>
    body { background: linear-gradient(135deg, #222 60%, #444); color: #fff; text-align: center; font-family: 'Segoe UI', 'Malgun Gothic', Arial, sans-serif; }
    h1 { font-size: 2em; margin-top: 20px; letter-spacing: 2px; }
    #container { display: flex; justify-content: center; align-items: flex-start; gap: 40px; margin-top: 10px; }
    #game-area { box-shadow: 0 0 20px #0008; border-radius: 12px; background: #181818; padding: 16px 12px; }
    #next-area { background: #222; border-radius: 12px; box-shadow: 0 0 10px #0006; padding: 10px; margin-top: 10px; }
    canvas { background: #111; border-radius: 8px; }
    #score { font-size: 1.3em; margin-top: 18px; font-weight: bold; letter-spacing: 1px; }
    #next-label { color: #fffa; font-size: 1em; margin-bottom: 4px; }
  </style>
</head>
<body>
  <h1>테트리스 게임</h1>
  <div id="container">
    <div id="game-area">
      <canvas id="tetris" width="300" height="600"></canvas>
      <div id="score">점수: 0</div>
    </div>
    <div id="next-area">
      <div id="next-label">다음 블록</div>
      <canvas id="next" width="120" height="120"></canvas>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('tetris');
    const ctx = canvas.getContext('2d');
    const nextCanvas = document.getElementById('next');
    const nextCtx = nextCanvas.getContext('2d');
    const COLS = 10, ROWS = 20, BLOCK = 30;
    const COLORS = [
      null,
      '#0ff', // I
      '#00f', // J
      '#fa0', // L
      '#ff0', // O
      '#0f0', // S
      '#f00', // Z
      '#808'  // T
    ];
    const SHAPES = [
      [],
      [[1,1,1,1]], // I
      [[1,0,0],[1,1,1]], // J
      [[0,0,1],[1,1,1]], // L
      [[1,1],[1,1]], // O
      [[0,1,1],[1,1,0]], // S
      [[1,1,0],[0,1,1]], // Z
      [[0,1,0],[1,1,1]]  // T
    ];

    function createMatrix(w, h) {
      const matrix = [];
      while (h--) matrix.push(new Array(w).fill(0));
      return matrix;
    }

    function drawMatrix(matrix, offset) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value) {
            ctx.fillStyle = COLORS[value];
            ctx.fillRect((x + offset.x) * BLOCK, (y + offset.y) * BLOCK, BLOCK, BLOCK);
            ctx.strokeStyle = "#333";
            ctx.strokeRect((x + offset.x) * BLOCK, (y + offset.y) * BLOCK, BLOCK, BLOCK);
          }
        });
      });
    }

    function merge(arena, player) {
      player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value) {
            arena[y + player.pos.y][x + player.pos.x] = value;
          }
        });
      });
    }

    function collide(arena, player) {
      const m = player.matrix, o = player.pos;
      for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
          if (m[y][x] &&
            (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
            return true;
          }
        }
      }
      return false;
    }

    // 블록 회전 함수 수정 (모양이 바뀌지 않도록, 직사각형도 회전 가능하게)
    function rotate(matrix) {
      const rows = matrix.length;
      const cols = matrix[0].length;
      const result = Array.from({length: cols}, () => Array(rows).fill(0));
      for (let y = 0; y < rows; ++y) {
        for (let x = 0; x < cols; ++x) {
          result[x][rows - 1 - y] = matrix[y][x];
        }
      }
      return result;
    }

    function playerDrop() {
      player.pos.y++;
      if (collide(arena, player)) {
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
        updateScore();
      }
      dropCounter = 0;
    }

    function playerMove(dir) {
      player.pos.x += dir;
      if (collide(arena, player)) {
        player.pos.x -= dir;
      }
    }

    // playerRotate 함수도 수정 (원본 matrix를 복사해서 회전)
    function playerRotate() {
      const rotated = rotate(player.matrix);
      const oldMatrix = player.matrix;
      const pos = player.pos.x;
      let offset = 1;
      player.matrix = rotated;
      while (collide(arena, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
          player.matrix = oldMatrix; // 원래대로 복구
          player.pos.x = pos;
          return;
        }
      }
    }

    // 다음 블록 관리
    function getRandomBlock() {
      const idx = Math.floor(Math.random() * (SHAPES.length - 1)) + 1;
      // 2차원 배열 깊은 복사
      return {
        matrix: SHAPES[idx].map(row => row.slice()),
        type: idx
      };
    }

    let next = getRandomBlock();

    function playerReset() {
      // 현재 블록을 next에서 가져오고, 다음 블록 준비
      player.matrix = next.matrix.map(row => row.slice());
      player.pos.y = 0;
      player.pos.x = Math.floor(COLS / 2) - Math.floor(player.matrix[0].length / 2);
      next = getRandomBlock();
      drawNextBlock();
      if (collide(arena, player)) {
        arena.forEach(row => row.fill(0));
        score = 0;
        updateScore();
        alert('게임 오버!');
      }
    }

    function arenaSweep() {
      let rowCount = 1;
      outer: for (let y = arena.length - 1; y >= 0; --y) {
        if (arena[y].every(val => val !== 0)) {
          arena.splice(y, 1);
          arena.unshift(new Array(COLS).fill(0));
          score += rowCount * 10;
          rowCount *= 2;
          y++;
        }
      }
    }

    function drawNextBlock() {
      nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
      // 중앙에 맞추기
      const matrix = next.matrix;
      const blockSize = 24;
      const offsetX = Math.floor((nextCanvas.width - matrix[0].length * blockSize) / 2);
      const offsetY = Math.floor((nextCanvas.height - matrix.length * blockSize) / 2);
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value) {
            nextCtx.fillStyle = COLORS[value];
            nextCtx.fillRect(offsetX + x * blockSize, offsetY + y * blockSize, blockSize, blockSize);
            nextCtx.strokeStyle = "#333";
            nextCtx.strokeRect(offsetX + x * blockSize, offsetY + y * blockSize, blockSize, blockSize);
          }
        });
      });
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawMatrix(arena, {x:0, y:0});
      drawMatrix(player.matrix, player.pos);
      // drawNextBlock(); // playerReset에서 호출됨
    }

    let dropCounter = 0;
    let dropInterval = 500;
    let lastTime = 0;
    let score = 0;

    function update(time = 0) {
      const delta = time - lastTime;
      lastTime = time;
      dropCounter += delta;
      if (dropCounter > dropInterval) {
        playerDrop();
      }
      draw();
      requestAnimationFrame(update);
    }

    function updateScore() {
      document.getElementById('score').innerText = '점수: ' + score;
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') playerMove(-1);
      else if (e.key === 'ArrowRight') playerMove(1);
      else if (e.key === 'ArrowDown') playerDrop();
      else if (e.key === 'ArrowUp') playerRotate();
      else if (e.key === 'Enter') {
        // 블록을 맨 아래까지 빠르게 내림
        while (!collide(arena, player)) {
          player.pos.y++;
        }
        player.pos.y--; // 마지막 충돌 전 위치로
        merge(arena, player);
        playerReset();
        arenaSweep();
        updateScore();
        dropCounter = 0;
      }
    });

    const arena = createMatrix(COLS, ROWS);
    const player = {
      pos: {x:0, y:0},
      matrix: null
    };

    window.onload = function() {
      playerReset();
      updateScore();
      update();
      drawNextBlock();
    };
  </script>
</body>
</html>
